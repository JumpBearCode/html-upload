      .search { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1.2; }
      .folder { fill: #4d8ee8; }
      .star { fill: #f5b301; }
      .star-empty { fill: none; stroke: #98a2b3; stroke-width: 1.45; }
      .shadow { filter: url(#softShadow); }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
