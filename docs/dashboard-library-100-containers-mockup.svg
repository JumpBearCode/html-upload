<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard Library 100 Containers Mockup</title>
  <desc id="desc">High fidelity UI mockup of Dashboard Library with 100 accessible containers, compact list view, permission tags, search, and favorites.</desc>
  <defs>
    <style>
      .page { fill: #fbfbfc; }
      .sidebar { fill: #f8f9fb; stroke: #d9dde5; stroke-width: 1; }
      .main { fill: #ffffff; }
      .line { stroke: #e1e5eb; stroke-width: 1; }
      .nav-active { fill: #eaf2ff; }
      .text-strong { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #111827; }
      .text-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #111827; }
      .text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #2f3746; }
      .muted { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #6b7280; }
      .tiny { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #6b7280; }
      .label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .chip { fill: #ffffff; stroke: #d8dee8; stroke-width: 1; }
      .chip-active { fill: #eaf2ff; stroke: #87b7f3; stroke-width: 1; }
      .tag-read { fill: #eaf3ff; stroke: #8bbcf6; stroke-width: 1; }
      .tag-write { fill: #eaf8f0; stroke: #83c79a; stroke-width: 1; }
      .tag-admin { fill: #fff4d6; stroke: #e5b84b; stroke-width: 1; }
      .tag-text { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #344054; }
      .row { fill: #ffffff; stroke: #e0e5ec; stroke-width: 1; }
      .row-alt { fill: #fcfdff; stroke: #e0e5ec; stroke-width: 1; }
      .search { fill: #ffffff; stroke: #8ca9cc; stroke-width: 1.4; }
      .dropdown { fill: #ffffff; stroke: #d8dee8; stroke-width: 1; filter: url(#shadow); }
      .shadow-card { filter: url(#shadow); }
      .icon-blue { fill: #3d82e0; }
      .icon-blue-dark { fill: #1f5fbf; }
      .star { fill: #f7b500; }
      .star-empty { fill: none; stroke: #9aa3af; stroke-width: 1.4; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

