<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard Library 100 Containers Mockup V2</title>
  <desc id="desc">Softer UI mockup for a dashboard library with 100 accessible containers, read and write access tags, global search autocomplete, and no folder-level favorites.</desc>
  <defs>
    <style>
      .page { fill: #f6f8fb; }
      .sidebar { fill: #ffffff; stroke: #e3e8f0; stroke-width: 1; }
      .main { fill: #f9fbfd; }
      .surface { fill: #ffffff; stroke: #e4e9f1; stroke-width: 1; }
      .line { stroke: #e5eaf1; stroke-width: 1; }
      .nav-active { fill: #eaf3ff; }
      text { font-family: Arial, Helvetica, sans-serif; }
      .h1 { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #182230; }
      .h2 { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #182230; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 400; fill: #334155; }
      .muted { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 400; fill: #667085; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 600; fill: #667085; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475467; }
      .chip { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1; }
      .chip-active { fill: #edf6ff; stroke: #8bbcf6; stroke-width: 1; }
      .tag-read { fill: #edf6ff; stroke: #93c5fd; stroke-width: 1; }
      .tag-write { fill: #ecfdf3; stroke: #86d39e; stroke-width: 1; }
      .tag-text { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; fill: #344054; }
      .row { fill: #ffffff; stroke: #e4e9f1; stroke-width: 1; }
      .row-soft { fill: #fbfdff; stroke: #e4e9f1; stroke-width: 1; }
      .search { fill: #ffffff; stroke: #9ab7d9; stroke-width: 1.3; }
      .dropdown { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; filter: url(#softShadow); }
      .folder { fill: #4d8ee8; }
      .folder-tab { fill: #69a3f0; }
      .blue { fill: #1f6fd1; }
      .softShadow { filter: url(#softShadow); }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b2a41" flood-opacity="0.10"/>
    </filter>
  </defs>

