      .folder { fill: #4d8ee8; }
      .star { fill: #f5b301; }
      .star-empty { fill: none; stroke: #98a2b3; stroke-width: 1.45; }
      .shadow { filter: url(#softShadow); }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b2a41" flood-opacity="0.10"/>
