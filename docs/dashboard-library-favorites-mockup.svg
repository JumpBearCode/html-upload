<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard Library Favorites Mockup</title>
  <desc id="desc">Mockup showing the Favorites view after users pin dashboards inside containers.</desc>
  <defs>
    <style>
      .page { fill: #f6f8fb; }
      .sidebar { fill: #ffffff; stroke: #e3e8f0; stroke-width: 1; }
      .main { fill: #f9fbfd; }
      .surface { fill: #ffffff; stroke: #e4e9f1; stroke-width: 1; }
      .line { stroke: #e5eaf1; stroke-width: 1; }
      .nav-active { fill: #fff7df; }
      text { font-family: Arial, Helvetica, sans-serif; }
      .h1 { font-size: 22px; font-weight: 700; fill: #182230; }
      .h2 { font-size: 16px; font-weight: 700; fill: #182230; }
      .body { font-size: 13px; font-weight: 400; fill: #334155; }
      .muted { font-size: 12px; font-weight: 400; fill: #667085; }
      .label { font-size: 12px; font-weight: 600; fill: #475467; }
      .chip { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1; }
